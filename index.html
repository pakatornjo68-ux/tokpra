/** Splits a server-sent-events stream into data payloads. */
function sseParser(onData) {
  let buf = '';
  const take = block => {
    const data = block.split(/\r?\n/).filter(l => l.startsWith('data:')).map(l => l.slice(5).replace(/^ /, '')).join('\n');
    if (data) onData(data);
  };
  return {
    push(text) {
      buf += text;
      let m;
      while ((m = /\r?\n\r?\n/.exec(buf))) { take(buf.slice(0, m.index)); buf = buf.slice(m.index + m[0].length); }
    },
    end() { if (buf.trim()) take(buf); buf = ''; },
  };
}

const Assistant = {
  // Fast mode starts with the quickest model and minimal thinking. When a model is busy,
  // out of free quota or slow to start, the next one is tried automatically.
  PLANS: {
    FAST: [
      { id: 'gemini-3.5-flash-lite', think: 'MINIMAL', firstMs: 10000 },
      { id: 'gemini-3.1-flash-lite', firstMs: 10000 },
      { id: 'gemini-3.6-flash', think: 'MINIMAL', firstMs: 15000 },
      { id: 'gemini-3.5-flash', think: 'MINIMAL', firstMs: 15000 },
      { id: 'gemini-3.8-flash', think: 'LOW', firstMs: 22000 },
    ],
    DETAILED: [
      { id: 'gemini-3.8-flash', think: 'LOW', firstMs: 25000 },
      { id: 'gemini-3.6-flash', think: 'LOW', firstMs: 20000 },
      { id: 'gemini-3.5-flash', think: 'LOW', firstMs: 20000 },
      { id: 'gemini-3.5-flash-lite', think: 'MINIMAL', firstMs: 12000 },
      { id: 'gemini-3.1-flash-lite', firstMs: 12000 },
    ],
  },
  IDLE_MS: 20000,
  TOTAL_MS: 120000,
  WAIT_MS: 60000, // no more models are tried once a question has waited this long
  // when every model fails, the reason shown is the first of these that happened
  WHY: ['key', 'network', 'blocked', 'server', 'timeout', 'quota', 'daily', 'gone'],
  cool: {},
  gone: new Set(),
  noThink: new Set(Local.get('tokpra.nothink', [])),

  /** Chat history to API contents: last 12 turns, alternating roles, starting with the user. */
  contents(history) {
    const msgs = history.filter(m => !m.error && m.text).slice(-12);
    while (msgs.length && msgs[0].role !== 'user') msgs.shift();
    const out = [];
    for (const m of msgs) {
      const role = m.role === 'user' ? 'user' : 'model';
      const text = m.text.length > 4000 ? m.text.slice(0, 4000) : m.text;
      const last = out[out.length - 1];
      if (last && last.role === role) last.parts[0].text += '\n\n' + text;
      else out.push({ role, parts: [{ text }] });
    }
    return out;
  },

  _order(mode) {
    const plans = (Assistant.PLANS[mode] || Assistant.PLANS.FAST).filter(p => !Assistant.gone.has(p.id));
    const now = Date.now();
    return plans.slice().sort((a, b) => ((Assistant.cool[a.id] || 0) > now) - ((Assistant.cool[b.id] || 0) > now));
  },

  _classify(status, raw) {
    let e = {};
    try { const j = JSON.parse(raw); e = (Array.isArray(j) ? j[0] : j).error || {}; } catch (x) { e = {}; }
    const msg = (e.message || '') + ' ' + JSON.stringify(e.details || '');
    if (/API key|API_KEY|api key/.test(msg) || status === 401) return 'key';
    // 403 for the whole service (switched off for this project) stops; 403 for one model tries the next
    if (status === 403) return /SERVICE_DISABLED|has not been used|is disabled|ACCESS_TOKEN/.test(msg) ? 'key' : 'gone';
    if (status === 404) return 'gone';
    if (status === 429 || e.status === 'RESOURCE_EXHAUSTED') {
      // limit 0: this key has no free use of this model at all, so it is skipped until the app restarts
      if (/limit: ?0\b|"quotaValue":"0"/.test(msg)) return 'gone';
      return /PerDay/.test(msg) ? 'daily' : 'quota';
    }
    if (status >= 500) return 'server';
    return 'bad';
  },

  /** One streamed attempt with one model. Never throws. */
  _attempt(plan, useThink, req, onText, holder) {
    const genCfg = { maxOutputTokens: req.mode === 'DETAILED' ? 4096 : 2048 };
    if (useThink && plan.think) genCfg.thinkingConfig = { thinkingLevel: plan.think };
    const body = { systemInstruction: { parts: [{ text: req.system }] }, contents: req.contents, generationConfig: genCfg };
    let text = '', raw = '', events = 0, finish = '', blocked = '', streamErr = null, timedOut = '';
    const t0 = Date.now();
    let last = t0;
    const take = j => {
      if (j.error) { streamErr = j.error; return; }
      if (j.promptFeedback && j.promptFeedback.blockReason) blocked = j.promptFeedback.blockReason;
      const c = j.candidates && j.candidates[0];
      if (!c) return;
      if (c.finishReason) finish = c.finishReason;
      for (const p of (c.content && c.content.parts) || []) if (typeof p.text === 'string' && !p.thought) text += p.text;
      if (text) onText(text);
    };
    const sse = sseParser(data => { events++; try { take(JSON.parse(data)); } catch (e) { /* partial or keep-alive */ } });
    const s = Net.stream(URLS.model + plan.id + ':streamGenerateContent?alt=sse', {
      headers: { 'x-goog-api-key': req.key }, json: body, timeout: Assistant.TOTAL_MS,
      onText: chunk => { last = Date.now(); if (raw.length < 300000) raw += chunk; sse.push(chunk); },
    });
    holder.cancel = () => { holder.stopped = true; s.cancel(); };
    return new Promise(resolve => {
      const watch = setInterval(() => {
        const now = Date.now();
        if (!text && now - t0 > plan.firstMs) timedOut = 'first';
        else if (text && now - last > Assistant.IDLE_MS) timedOut = 'idle';
        else if (now - t0 > Assistant.TOTAL_MS) timedOut = 'total';
        if (timedOut) { clearInterval(watch); s.cancel(); }
      }, 400);
      const finishUp = res => {
        clearInterval(watch);
        holder.cancel = null;
        if (holder.stopped) return resolve({ ok: true, text, cut: text ? 'stopped' : '', stopped: true });
        if (timedOut) return resolve(text ? { ok: true, text, cut: 'timeout' } : { ok: false, kind: 'timeout' });
        if (!res) return resolve(text ? { ok: true, text, cut: 'network' } : { ok: false, kind: 'network' });
        if (res.status >= 400) return resolve({ ok: false, kind: Assistant._classify(res.status, res.text), status: res.status });
        sse.end();
        if (!events && raw.trim()) {
          // the server answered without SSE framing: accept a plain JSON array or object
          try { const j = JSON.parse(raw); (Array.isArray(j) ? j : [j]).forEach(take); } catch (e) { /* ignore */ }
        }
        if (streamErr) return resolve({ ok: false, kind: Assistant._classify(Number(streamErr.code) || 500, JSON.stringify({ error: streamErr })) });
        if (!text) return resolve({ ok: false, kind: blocked || /SAFETY|PROHIBITED|BLOCKLIST|SPII/.test(finish) ? 'blocked' : 'empty' });
        resolve({ ok: true, text, cut: finish === 'MAX_TOKENS' ? 'length' : '' });
      };
      s.done.then(finishUp, err => finishUp(err && err.code === E.CANCELLED ? { status: 200, text: '' } : null));
    });
  },

  /**
   * Streams a reply. req: { key, mode, system, contents }. onText(full text so far).
   * holder.cancel() stops the answer (set while streaming). Resolves { text, cut }.
   */
  async reply(req, onText, holder) {
    if (!req.key) throw new AppError(E.ASSISTANT, 'ยังไม่ได้ตั้งค่าผู้ช่วย');
    const kinds = [], t0 = Date.now();
    let plans = Assistant._order(req.mode);
    if (!plans.length) { Assistant.gone.clear(); plans = Assistant._order(req.mode); }
    for (const plan of plans) {
      if (holder.stopped || Date.now() - t0 > Assistant.WAIT_MS) break;
      let useThink = !!plan.think && !Assistant.noThink.has(plan.id);
      let r = await Assistant._attempt(plan, useThink, req, onText, holder);
      if (!r.ok && r.kind === 'bad' && useThink && !holder.stopped) {
        // this model rejected the thinking setting: remember and ask again without it
        Assistant.noThink.add(plan.id); Local.set('tokpra.nothink', Array.from(Assistant.noThink));
        r = await Assistant._attempt(plan, false, req, onText, holder);
      }
      if (r.ok) return r;
      kinds.push(r.kind);
      if (r.kind === 'key' || r.kind === 'blocked' || r.kind === 'network') break;
      if (r.kind === 'gone') Assistant.gone.add(plan.id);
      Assistant.cool[plan.id] = Date.now() + ({ quota: 60000, daily: 3600000 }[r.kind] || 20000);
      onText('');
    }
    if (holder.stopped) return { text: '', cut: 'stopped', stopped: true };
    throw Assistant.errorFor(Assistant._why(kinds));
  },

  /** Forget skipped and resting models, e.g. after the key changes. */
  fresh() { Assistant.cool = {}; Assistant.gone.clear(); },

  /** The most useful reason to show when no model answered. */
  _why(kinds) {
    return Assistant.WHY.find(k => kinds.includes(k)) || kinds[kinds.length - 1] || 'empty';
  },

  /** Free daily quota starts again at midnight Pacific time: 15:00 in Thailand, 14:00 while the US is on summer time. */
  _resetHour() {
    try {
      const tz = new Intl.DateTimeFormat('en-US', { timeZone: 'America/Los_Angeles', timeZoneName: 'shortOffset' })
        .formatToParts(new Date()).find(p => p.type === 'timeZoneName').value;
      const off = Number((tz.match(/GMT([+-]\d+)/) || [])[1]);
      if (off === -7 || off === -8) return 7 - off;
    } catch (e) { /* old browser */ }
    return 15;
  },

  errorFor(kind) {
    const admin = Session.profile && Session.profile.isAdmin();
    const msg = {
      key: admin ? 'คีย์ของผู้ช่วยใช้ไม่ได้ ตรวจสอบที่ ตั้งค่า > ผู้ช่วย' : 'ผู้ช่วยยังใช้งานไม่ได้ แจ้งผู้ดูแลให้ตรวจสอบการตั้งค่าผู้ช่วย',
      quota: 'ช่วงนี้มีการใช้ผู้ช่วยมากจนเกินโควตาฟรี รอประมาณ 1 นาทีแล้วลองใหม่',
      daily: 'โควตาฟรีของผู้ช่วยวันนี้หมดแล้ว ใช้ได้อีกครั้งหลัง ' + Assistant._resetHour() + ':00 น.',
      timeout: 'ผู้ช่วยตอบช้ากว่าปกติ ลองใหม่อีกครั้ง',
      server: 'ระบบผู้ช่วยไม่ว่างชั่วคราว ลองใหม่อีกครั้ง',
      network: 'ไม่มีการเชื่อมต่ออินเทอร์เน็ต ตรวจสอบแล้วลองใหม่',
      blocked: 'ผู้ช่วยตอบคำถามนี้ไม่ได้ ลองถามด้วยคำอื่น',
      gone: admin ? 'คีย์นี้ใช้ผู้ช่วยรุ่นที่แอปรองรับไม่ได้ ตรวจสอบคีย์ที่ ตั้งค่า > ผู้ช่วย' : 'ผู้ช่วยยังใช้งานไม่ได้ แจ้งผู้ดูแลให้ตรวจสอบการตั้งค่าผู้ช่วย',
    }[kind] || 'ผู้ช่วยไม่ได้ส่งคำตอบกลับมา ลองใหม่อีกครั้ง';
    return new AppError(kind === 'quota' || kind === 'daily' ? E.QUOTA : kind === 'network' ? E.NETWORK : E.ASSISTANT, msg);
  },

  /** Admin check from the settings screen: returns seconds to the first words. */
  async test(key, mode) {
    Assistant.fresh();
    const t0 = Date.now();
    let first = 0;
    const holder = {};
    await Assistant.reply({ key, mode, system: 'ตอบสั้นที่สุด', contents: [{ role: 'user', parts: [{ text: 'ตอบคำเดียวว่า พร้อม' }] }] },
      t => { if (t && !first) first = Date.now(); }, holder);
    return ((first || Date.now()) - t0) / 1000;
  },
};

/* ---------- optional PIN lock: asked when the app opens and after a minute in the background ----------
   Only a salted SHA-256 of the PIN is kept on this device; five wrong tries sign the account out. */
const Lock = {
  key() { return 'tokpra.pin.' + (Session.uid || ''); },
  get() { return Session.uid ? Local.get(Lock.key(), null) : null; },
  on() { return !!Lock.get(); },
  async hash(salt, pin) {
    const data = new TextEncoder().encode(salt + ':' + pin);

  },
  async set(pin) {
    const salt = Array.from(crypto.getRandomValues(new Uint8Array(12))).map(b => b.toString(16).padStart(2, '0')).join('');
    Local.set(Lock.key(), { salt, hash: await Lock.hash(salt, pin), tries: 0 });
  },
  clear() { try { localStorage.removeItem(Lock.key()); } catch (e) { /* storage blocked */ } },
  async check(pin) { const p = Lock.get(); return !!p && (await Lock.hash(p.salt, pin)) === p.hash; },
  hiddenAt: 0, shown: false,
  /** The keypad screen. purpose: 'unlock', 'set' (twice) or 'off' (confirm). Resolves with the PIN, or null when cancelled. */
  pad(purpose) {

      let entry = '', first = null;
      const title = h('div', { class: 'pintitle' }), dots = h('div', { class: 'pindots', 'aria-hidden': 'true' }), msg = h('div', { class: 'pinmsg', role: 'alert' });
      const say = () => {
        title.textContent = purpose === 'unlock' ? 'ใส่รหัส PIN' : purpose === 'off' ? 'ใส่รหัส PIN เพื่อปิดการล็อก' : first == null ? 'ตั้งรหัส PIN 4 หลัก' : 'ใส่รหัส PIN อีกครั้ง';
        fill(dots, [0, 1, 2, 3].map(i => h('i', { class: i < entry.length ? 'on' : '' })));
      };
      const finish = v => { screen.remove(); Lock.shown = false; resolve(v); };
      const wrong = text => { msg.textContent = text; screen.classList.remove('shake'); void screen.offsetWidth; screen.classList.add('shake'); Feedback.error(); entry = ''; say(); };
      const digit = async d => {
        if (entry.length >= 4) return;
        entry += d; msg.textContent = ''; say();
        if (entry.length < 4) return;
        const pin = entry;
        if (purpose === 'set') {
          if (first == null) { first = pin; entry = ''; setTimeout(say, 120); return; }
          if (pin !== first) { first = null; wrong('รหัสไม่ตรงกัน เริ่มตั้งใหม่'); return; }
          finish(pin); return;
        }
        if (await Lock.check(pin)) { const p = Lock.get(); if (p) { p.tries = 0; Local.set(Lock.key(), p); } finish(pin); return; }
        const p = Lock.get(); p.tries = (p.tries || 0) + 1; Local.set(Lock.key(), p);
        if (p.tries >= 5) { Lock.clear(); finish(null); Chat.clear(); Auth.logout(); go('#/login', { replace: true }); alertBox('ออกจากระบบแล้ว', 'ใส่รหัส PIN ผิด 5 ครั้ง เข้าสู่ระบบด้วยอีเมลและรหัสผ่านอีกครั้ง แล้วตั้ง PIN ใหม่ได้'); return; }
        wrong('รหัสไม่ถูกต้อง เหลืออีก ' + (5 - p.tries) + ' ครั้ง');
      };
      const key = (label, fn, cls) => h('button', { type: 'button', class: 'pinkey' + (cls ? ' ' + cls : ''), 'aria-label': label, onclick: fn }, label);
      const keys = h('div', { class: 'pinpad' }, ['1', '2', '3', '4', '5', '6', '7', '8', '9'].map(d => key(d, () => digit(d))),
        purpose === 'unlock' ? key('ลืม PIN', async () => {
          if (await confirmBox('ลืมรหัส PIN', 'ต้องเข้าสู่ระบบด้วยอีเมลและรหัสผ่านอีกครั้ง แล้วตั้ง PIN ใหม่ได้', 'ออกจากระบบ', true)) {
            Lock.clear(); finish(null); Chat.clear(); Auth.logout(); go('#/login', { replace: true });
          }
        }, 'text') : key('ยกเลิก', () => finish(null), 'text'),
        key('0', () => digit('0')),
        h('button', { type: 'button', class: 'pinkey text', 'aria-label': 'ลบ', onclick: () => { entry = entry.slice(0, -1); say(); } }, ic('backspace')));
      const screen = h('div', { class: 'pinscreen', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'รหัส PIN' },
        h('div', { class: 'pinbody' }, wordmark(), title, dots, msg, keys));
      document.body.append(screen); Lock.shown = true; say();
      screen.addEventListener('keydown', ev => { if (/^[0-9]$/.test(ev.key)) digit(ev.key); else if (ev.key === 'Backspace') { entry = entry.slice(0, -1); say(); } });
      screen.tabIndex = -1; screen.focus();
    });
  },
  async lockNow() { if (Lock.on() && !Lock.shown && Session.ok()) await Lock.pad('unlock'); },
  onHidden() { Lock.hiddenAt = Date.now(); },
  onVisible() { if (Lock.hiddenAt && Date.now() - Lock.hiddenAt > 60000) Lock.lockNow(); Lock.hiddenAt = 0; },
};

/* ---------- pull down to refresh (home, records, reports) ---------- */
const PTR = {
  run: null, y0: 0, d: 0, active: false, busy: false, el: null,
  init() {
    PTR.el = h('div', { id: 'ptr', 'aria-hidden': 'true' }, ic('refresh'));
    document.body.append(PTR.el);
    window.addEventListener('touchstart', e => {
      PTR.active = !!(PTR.run && !Lock.shown && window.scrollY <= 0 && e.touches.length === 1 && $('#sheet').classList.contains('hidden') && $('#modal').classList.contains('hidden'));
      PTR.y0 = e.touches[0].clientY; PTR.d = 0;
    }, { passive: true });
    window.addEventListener('touchmove', e => {
      if (!PTR.active) return;
      const dy = e.touches[0].clientY - PTR.y0;
      if (dy <= 0 || window.scrollY > 0) { PTR.reset(); PTR.active = false; return; }
      if (e.cancelable) e.preventDefault();
      PTR.d = Math.min(dy * 0.5, 96);
      const armed = PTR.d >= 64;
      if (armed && !PTR.el.classList.contains('armed')) Feedback.tick();
      PTR.el.classList.add('show'); PTR.el.classList.toggle('armed', armed);
      PTR.el.style.transform = 'translate(-50%,' + PTR.d + 'px) rotate(' + (PTR.d * 3.2) + 'deg)';
    }, { passive: false });
    window.addEventListener('touchend', () => {
      if (!PTR.active) return;
      PTR.active = false;
      if (PTR.d < 64) { PTR.reset(); return; }
      PTR.el.classList.add('spin'); PTR.el.style.transform = 'translate(-50%,64px)'; PTR.busy = true;
      Promise.resolve().then(() => PTR.run()).catch(() => {}).finally(() => { PTR.busy = false; setTimeout(PTR.reset, 280); });
    });
  },
  reset() { if (!PTR.el) return; PTR.el.classList.remove('show', 'armed', 'spin'); PTR.el.style.transform = ''; },
};

/* ---------- keyboard: hide the tab bar while the on-screen keyboard is open ---------- */
// The keyboard is open when a text field has focus and the visible height shrank.
// Closing the keyboard with Android's back button keeps focus, so focus alone is not enough.
const Kbd = { base: 0, width: 0 };
function updateKbd() {
  const vv = window.visualViewport;
  if (window.innerWidth !== Kbd.width) { Kbd.width = window.innerWidth; Kbd.base = 0; }
  const now = Math.min(window.innerHeight, vv ? vv.height : window.innerHeight);
  Kbd.base = Math.max(Kbd.base, window.innerHeight);
  const a = document.activeElement;
  const typing = !!(a && a.matches && a.matches('input:not([type=checkbox]):not([type=radio]):not([type=date]),textarea'));
  document.body.classList.toggle('kbd', typing && window.innerWidth < 960 && now < Kbd.base * 0.8);
}
window.addEventListener('resize', updateKbd);
if (window.visualViewport) window.visualViewport.addEventListener('resize', updateKbd);
document.addEventListener('focusin', () => setTimeout(updateKbd, 350));
document.addEventListener('focusout', () => setTimeout(updateKbd, 60));

    // a shortcut or link to a screen: open it right after signing in
    if (hash && hash !== '#/login' && hash !== '#/' && ROUTES.some(x => x.re.test(hash))) Nav.after = hash;
    if (hash !== '#/login') history.replaceState(null, '', '#/login');

  if (!hash || hash === '#/' || hash === '#/login') { history.replaceState(null, '', '#/home'); return route(); }
  const r = ROUTES.find(x => x.re.test(hash));

  if (r.admin && !Session.profile.isAdmin()) { toast('เฉพาะผู้ดูแลระบบ'); history.replaceState(null, '', '#/home'); return route(); }

/** Money in above the line, money out below it, one column per day for the last 14 days (one scale for both). */
function cashChart(items, today) {
  const days = [];
  for (let i = 13; i >= 0; i--) days.push({ d: D.addDays(today, -i), inn: 0, out: 0 });
  const at = new Map(days.map(x => [x.d, x]));
  for (const it of items) {
    if (it.deleted) continue;
    const x = at.get(it.rec.date); if (!x) continue;
    if (KINDS[it.kind].sign > 0) x.inn += it.amount; else x.out += it.amount;
  }
  const maxIn = Math.max(0, ...days.map(x => x.inn)), maxOut = Math.max(0, ...days.map(x => x.out));
  if (!maxIn && !maxOut) return null;
  const W = 336, H = 132, band = W / 14, bw = 12, top = 6, axis = 16;
  const k = (H - top - 2) / (maxIn + maxOut);
  const y0 = top + maxIn * k;
  const col = (x, h, up) => {
    if (h <= 0) return '';
    h = Math.max(h, 2); const r = Math.min(4, bw / 2, h);
    if (up) { const y = y0 - 1 - h; return 'M' + x + ',' + (y0 - 1) + 'V' + (y + r) + 'Q' + x + ',' + y + ' ' + (x + r) + ',' + y + 'H' + (x + bw - r) + 'Q' + (x + bw) + ',' + y + ' ' + (x + bw) + ',' + (y + r) + 'V' + (y0 - 1) + 'Z'; }
    const y = y0 + 1 + h; return 'M' + x + ',' + (y0 + 1) + 'V' + (y - r) + 'Q' + x + ',' + y + ' ' + (x + r) + ',' + y + 'H' + (x + bw - r) + 'Q' + (x + bw) + ',' + y + ' ' + (x + bw) + ',' + (y - r) + 'V' + (y0 + 1) + 'Z';
  };
  let svg = '<svg viewBox="0 0 ' + W + ' ' + (H + axis) + '" class="cash" role="img" aria-hidden="true">';
  svg += '<line x1="0" x2="' + W + '" y1="' + y0 + '" y2="' + y0 + '" class="base"/>';
  days.forEach((x, i) => {
    const cx = i * band + (band - bw) / 2;
    svg += '<g class="day" data-i="' + i + '"><rect class="hit" x="' + (i * band) + '" y="0" width="' + band + '" height="' + (H + axis) + '"/>'
      + '<path class="in" d="' + col(cx, x.inn * k, true) + '"/><path class="out" d="' + col(cx, x.out * k, false) + '"/>'
      + '<text x="' + (i * band + band / 2) + '" y="' + (H + axis - 3) + '" class="dn' + (i === 13 ? ' now' : '') + '">' + D.ymd(x.d)[2] + '</text></g>';
  });
  svg += '</svg>';
  const sum = (f) => days.reduce((a, x) => a + x[f], 0);

  const show = i => {
    const x = i == null ? null : days[i];
    fill(read, h('span', { class: 'when', text: x ? dateLabel(x.d) : 'รวม 14 วัน' }),
      h('span', { class: 'kv2' }, h('i', { class: 'key in' }), 'รายรับ ', fig(x ? x.inn : sum('inn'))),
      h('span', { class: 'kv2' }, h('i', { class: 'key out' }), 'รายจ่าย ', fig(x ? x.out : sum('out'))));
    box.querySelectorAll('.day').forEach(g => g.classList.toggle('dim', i != null && Number(g.dataset.i) !== i));
  };
  const box = h('section', { class: 'cashbox', 'aria-label': 'รายรับและรายจ่าย 14 วันล่าสุด รายรับรวม ' + Money.baht(sum('inn')) + ' รายจ่ายรวม ' + Money.baht(sum('out')) },
    h('div', { class: 'cashhead' }, h('b', { text: '14 วันล่าสุด' }), h('span', { class: 'dim small grow', text: 'แตะแท่งเพื่อดูรายวัน' }),
      h('button', { class: 'mini', type: 'button', 'aria-pressed': 'false', onclick: ev => toggleTable(ev.currentTarget) }, ic('list', 'sm'), 'ตาราง')),
    read);
  const t = document.createElement('template'); t.innerHTML = svg; const chart = t.content.firstChild;
  // the same numbers as a table, for reading exact values or with a screen reader
  const table = h('table', { class: 'cashtable hidden' },
    h('thead', null, h('tr', null, h('th', { text: 'วันที่' }), h('th', { text: 'รายรับ' }), h('th', { text: 'รายจ่าย' }))),
    h('tbody', null, days.slice().reverse().map(x => h('tr', null, h('td', { text: dateLabel(x.d) }), h('td', null, fig(x.inn)), h('td', null, fig(x.out))))));
  const toggleTable = btn => {

    btn.setAttribute('aria-pressed', String(on)); fill(btn, ic(on ? 'report' : 'list', 'sm'), on ? 'กราฟ' : 'ตาราง');
  };
  box.append(chart, table);

  const pick = ev => {
    const g = ev.target.closest && ev.target.closest('.day'); if (!g) return;
    const i = Number(g.dataset.i); picked = picked === i && ev.type === 'click' ? null : i; show(picked);

function afterSaveEdit(msg) { done(msg); goBack(true); }
/** Shared save flow: validation errors go next to the field, others offer a retry with the same request. */
async function runSave(form, btn, label, fn) {

/** The period just before a report's period: the previous month or year when the report covers one, otherwise the same number of days. */
function periodBefore(s, e) {
  if (D.monthStart(s) === s && D.addDays(D.monthEnd(s), 1) === e) return [D.prevMonthStart(s), s];
  if (D.yearStart(s) === s && D.addDays(D.yearEnd(s), 1) === e) return [D.yearStart(D.addDays(s, -1)), s];
  const days = Math.round((e - s) / 86400000);
  return [D.addDays(s, -days), s];
}

/** Safe light formatting for replies: bold, bullets, numbered lines. */
/** A reply as plain text for pasting elsewhere: no markdown marks. */
function plainReply(md) {
  return md.replace(/\*\*(.+?)\*\*/g, '$1').replace(/^#+\s*/gm, '').replace(/^\s*[-*]\s+/gm, '• ').trim();
}
function formatReply(md) {
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  return md.replace(/\r/g, '').split('\n').map(line => {
    let x = line;
    const head = /^\s*#{1,6}\s+(.*)$/.exec(x);
    if (head) x = '**' + head[1] + '**';
    else x = x.replace(/^(\s*)[*-]\s+/, '$1• ');
    return esc(x).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(^|[\s(])\*(?!\s)([^*]+?)\*(?=[\s).,!?]|$)/g, '$1<i>$2</i>');
  }).join('\n');
}

      const system = systemPrompt({ name: me.fullName || 'ผู้ใช้', admin: me.isAdmin(), today: ' ' + D.dayLabel(D.today()) + ' ' + D.fmt(D.today()), notes: c.notes });
      const r = await Assistant.reply({ key: c.key, mode: c.mode, system, contents: Assistant.contents(Chat.msgs) }, partial => {
        if (!alive(t)) return;
        if (partial) live.innerHTML = formatReply(partial);
        else fill(live, h('span', { class: 'dots' }, h('i'), h('i'), h('i')));
        scrollEnd(false);
      }, holder);
      if (r.stopped && !r.text) {
        Chat.msgs.splice(Chat.msgs.indexOf(mine), 1); mineEl.remove(); live.remove(); box.value = text;
        if (!Chat.msgs.length) drawAll();
      }
      else {
        const m = { role: 'model', text: r.text, cut: r.cut || '', at: Date.now() };
        Chat.msgs.push(m);
        if (alive(t)) { live.replaceWith(bubble(m)); followups(); }
      }
    } catch (e) {
      const err = { role: 'model', error: true, text: toAppError(e).message, at: Date.now() };
      Chat.msgs.push(err);
      if (alive(t)) live.replaceWith(bubble(err));
    } finally {
      holder = null;
      Chat.save();
      if (alive(t)) { setSending(false); scrollEnd(false); }
    }
  }
  send.onclick = () => {
    if (sending) { if (holder) { holder.stopped = true; if (holder.cancel) holder.cancel(); } return; }
    ask(box.value);
  };
  box.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && window.matchMedia('(pointer:fine)').matches) { e.preventDefault(); send.click(); }
  });
  box.addEventListener('input', () => { box.style.height = 'auto'; box.style.height = Math.min(box.scrollHeight, 132) + 'px'; });
  drawAll();
}

async function UserPage(uid) {
  const t = navToken; const isNew = uid === 'new'; const isSelf = uid === Session.uid;
  setPage({ tab: 'settings', sub: true, guard: true, title: isNew ? 'เพิ่มผู้ใช้' : 'แก้ไขผู้ใช้' });
  let p = { role: 'STAFF', recordScope: 'OWN', status: true, permissions: {} };
  if (!isNew) {
    fill(app(), skeleton(3));
    p = await Users.getProfile(uid);
    if (!alive(t)) return;
    if (!p) throw new AppError(E.NOT_FOUND, 'ไม่พบผู้ใช้นี้');
  }
  const form = {};
  const email = textInput('email', 'name@example.com', { autocapitalize: 'none', inputmode: 'email', spellcheck: 'false' });
  const pw = passwordInput('อย่างน้อย 6 ตัวอักษร', 'new-password');
  const name = textInput('text', 'ชื่อ นามสกุล', { value: p.fullName || '' });
  let role = p.role, scope = p.recordScope;
  const perms = Object.assign({}, p.permissions);
  const permBox = h('div');
  const status = toggleRow('เปิดใช้งาน', 'ปิดแล้วผู้ใช้จะเข้าสู่ระบบไม่ได้ ข้อมูลเดิมยังอยู่ครบ', p.status);
  const roleSeg = seg([['STAFF', 'พนักงาน'], ['ADMIN', 'ผู้ดูแลระบบ']], role, v => { role = v; drawPerms(); }, 'บทบาท');
  const scopeSeg = seg([['OWN', 'เฉพาะของตนเอง'], ['ALL', 'ทุกรายการ']], scope, v => { scope = v; }, 'ขอบเขตรายการ');
  const scopeField = h('div', { class: 'field' }, h('span', { class: 'lbl', text: 'เห็นรายการ' }), scopeSeg, h('div', { class: 'hint', text: 'เฉพาะของตนเอง คือดูและแก้ได้เฉพาะรายการที่คนนี้บันทึก' }));
  const PRESETS = [
    ['บันทึกอย่างเดียว', ['revenue.create', 'fish_cost.create', 'expense.create']],
    ['บันทึกและดู', ['revenue.read', 'revenue.create', 'fish_cost.read', 'fish_cost.create', 'expense.read', 'expense.create']],
    ['จัดการรายการ', PERMS.map(x => x[0])],
  ];
  function drawPerms() {
    const admin = role === 'ADMIN';
    scopeField.classList.toggle('hidden', admin);
    if (admin) { fill(permBox, h('p', { class: 'note', text: 'ผู้ดูแลระบบมีทุกสิทธิ์และเห็นทุกรายการ รวมถึงรายงาน ตั้งค่า และการจัดการผู้ใช้' })); return; }
    const groups = [];
    for (const [k, group, act] of PERMS) {
      let g = groups.find(x => x.name === group);
      if (!g) { g = { name: group, items: [] }; groups.push(g); }
      g.items.push([k, act]);
    }
    fill(permBox, 
      h('div', { class: 'chips suggest' }, PRESETS.map(([label, keys]) => h('button', { type: 'button', class: 'chip', text: label, onclick: () => {
        for (const [k] of PERMS) perms[k] = keys.includes(k); drawPerms();
      } }))),
      ...groups.map(g => h('div', { class: 'permrow' }, h('span', { class: 'pname', text: g.name }),
        h('div', { class: 'pacts' }, g.items.map(([k, act]) => {
          const box = h('input', { type: 'checkbox', 'aria-label': g.name + ' ' + act });
          box.checked = perms[k] === true;
          const lab = h('label', { class: 'pchip' + (box.checked ? ' on' : '') }, box, act);
          box.addEventListener('change', () => { perms[k] = box.checked; lab.classList.toggle('on', box.checked); });
          return lab;
        })))));
  }
  drawPerms();
  if (isSelf) { roleSeg.disable(true); status.box.disabled = true; }
  const save = h('button', { class: 'btn', type: 'button', text: isNew ? 'เพิ่มผู้ใช้' : 'บันทึก' });
  fill(app(), 
    h('div', { class: 'panel' },
      isNew ? [field(form, 'email', 'อีเมลสำหรับเข้าสู่ระบบ', email), field(form, 'password', 'รหัสผ่านเริ่มต้น', pw, 'แจ้งอีเมลและรหัสผ่านนี้ให้ผู้ใช้ ผู้ใช้เปลี่ยนรหัสเองได้ในตั้งค่า')]
        : h('div', { class: 'field' }, h('span', { class: 'lbl', text: 'อีเมล' }), h('div', { class: 'b', text: p.email })),
      field(form, 'full_name', 'ชื่อที่แสดง', name),
      h('div', { class: 'field' }, h('span', { class: 'lbl', text: 'บทบาท' }), roleSeg),
      scopeField),
    h('h2', { class: 'h2', text: 'สิทธิ์การใช้งาน' }),
    h('div', { class: 'panel' }, permBox),
    h('div', { class: 'panel' }, status, isSelf ? h('p', { class: 'note', text: 'บัญชีของคุณเองเปลี่ยนบทบาทหรือปิดการใช้งานไม่ได้ เพื่อไม่ให้ล็อกตัวเองออกจากระบบ' }) : null),
    save,
    !isNew ? h('button', { class: 'btn ghost', type: 'button', onclick: async () => {
      try { await withBusy('กำลังส่ง', () => Auth.sendReset(p.email)); toast('ส่งลิงก์ตั้งรหัสผ่านใหม่ไปที่ ' + p.email + ' แล้ว'); } catch (e) { showError(e); }
    } }, ic('mail', 'sm'), 'ส่งลิงก์ตั้งรหัสผ่านใหม่ทางอีเมล') : null);
  save.onclick = async () => {
    clearErrors(form);
    const next = isNew ? { permissions: {} } : p;
    if (isNew) next.email = email.value;
    next.fullName = name.value; next.role = role; next.recordScope = role === 'ADMIN' ? 'ALL' : scope;
    next.permissions = {}; for (const [k] of PERMS) next.permissions[k] = perms[k] === true;
    next.status = status.box.checked;
    save.disabled = true;
    try {
      await withBusy('กำลังบันทึก', () => Users.upsert(next, isNew, isNew ? pw.input.value : null));
      done(isNew ? 'เพิ่มผู้ใช้แล้ว' : 'บันทึกแล้ว'); goBack(true);
    } catch (e) { showError(e, form); } finally { save.disabled = false; }
  };
}

async function AssistantSettingsPage() {
  const t = navToken;
  setPage({ tab: 'settings', sub: true, guard: true, title: 'ผู้ช่วย' });
  fill(app(), skeleton(3));
  const cfg = await AssistantConfig.get(true);
  if (!alive(t)) return;
  const form = {};
  const enabled = toggleRow('เปิดใช้ผู้ช่วย', 'ทุกคนในกิจการจะเห็นเมนูผู้ช่วย', cfg.enabled || !cfg.exists);
  const key = passwordInput('วางคีย์บริการ', 'off');
  key.input.value = cfg.key;
  let mode = cfg.mode;
  const MODE_HINT = { FAST: 'เริ่มตอบภายในไม่กี่วินาที เหมาะกับการใช้งานทั่วไป', DETAILED: 'คิดละเอียดกว่า ใช้เวลานานขึ้น' };
  const modeHint = h('div', { class: 'hint', text: MODE_HINT[mode] });
  const notes = textArea('เช่น เปิดทุกวัน 8:00 ถึง 18:00 ค่าตกปลาชั่วโมงละ 100 บาท มีปลานิล ปลาสวาย ปลาบึก', 4);
  notes.value = cfg.notes;
  const status = h('div', { class: 'small' });
  const test = h('button', { class: 'btn ghost', type: 'button' }, ic('check', 'sm'), 'ทดสอบการเชื่อมต่อ');
  const save = h('button', { class: 'btn', type: 'button', text: 'บันทึก' });
  fill(app(), 
    h('div', { class: 'panel' }, enabled),
    h('div', { class: 'panel' },
      field(form, 'key', 'คีย์บริการ', key, 'คีย์จะเก็บในฐานข้อมูลของกิจการ ไม่อยู่ในไฟล์ของแอป'),
      h('div', { class: 'field' }, h('span', { class: 'lbl', text: 'ความเร็วในการตอบ' }),
        seg([['FAST', 'เร็ว'], ['DETAILED', 'ละเอียด']], mode, v => { mode = v; modeHint.textContent = MODE_HINT[v]; }, 'ความเร็วในการตอบ'), modeHint),
      field(form, 'notes', 'ข้อมูลกิจการที่ผู้ช่วยควรรู้', notes, 'ผู้ช่วยใช้ข้อมูลนี้ประกอบคำตอบ เช่น เวลาเปิด ราคา ชนิดปลา')),
    status, test, save,
    h('p', { class: 'note', text: 'ผู้ช่วยมองไม่เห็นรายการในแอป ข้อความที่พิมพ์คุยจะถูกส่งไปประมวลผลที่ผู้ให้บริการภายนอก จึงไม่ควรพิมพ์ข้อมูลส่วนตัว' }));
  test.onclick = async () => {
    clearErrors(form);
    if (key.input.value.trim().length < 20) { showError(invalid('key', 'วางคีย์บริการให้ครบก่อนทดสอบ'), form); return; }
    test.disabled = true; status.className = 'small muted'; status.textContent = 'กำลังทดสอบ';
    try {
      const sec = await Assistant.test(key.input.value.trim(), mode);
      status.className = 'saved'; fill(status, ic('check', 'sm'), h('span', { text: 'เชื่อมต่อได้ เริ่มตอบใน ' + sec.toFixed(1) + ' วินาที' }));
    } catch (e) {
      status.className = 'notice bad'; fill(status, ic('info', 'sm'), h('span', { class: 'grow', text: toAppError(e).message }));
    } finally { test.disabled = false; }
  };
  save.onclick = async () => {
    clearErrors(form); save.disabled = true;
    try {
      await withBusy('กำลังบันทึก', () => AssistantConfig.save({ key: key.input.value, enabled: enabled.box.checked, mode, notes: notes.value }));
      done('บันทึกการตั้งค่าผู้ช่วยแล้ว'); goBack(true);
    } catch (e) {
      if (e.code === E.DENIED) e = new AppError(E.DENIED, 'ฐานข้อมูลยังใช้กฎความปลอดภัยรุ่นเก่า เปิด Firebase > Firestore > Rules แล้ววางกฎชุดใหม่ของแอปเวอร์ชันนี้ แล้วกด Publish จากนั้นบันทึกอีกครั้ง');
      showError(e, form);
    } finally { save.disabled = false; }
  };
}

/* =====================================================================
   Start
   ===================================================================== */
function updateOnline() { $('#offline').classList.toggle('hidden', navigator.onLine !== false); }
window.addEventListener('online', updateOnline);
window.addEventListener('offline', updateOnline);
document.addEventListener('visibilitychange', () => {
  // coming back to the app after a while: refresh the profile and data quietly
  if (document.visibilityState === 'visible' && Session.ok() && currentRoute && !currentRoute.sub && Date.now() - (window.__hiddenAt || 0) > 5 * 60 * 1000) { Cache.dirty(); route(); }
  if (document.visibilityState === 'hidden') window.__hiddenAt = Date.now();
});

function hideBoot() {
  const b = document.getElementById('boot');
  if (!b) return;
  b.classList.add('out');
  setTimeout(() => b.remove(), 300);
  if (Native && Native.ready) { try { Native.ready(); } catch (e) { /* older shell */ } }
}
(async function start() {
  fill($('#back'), ic('back'));
  $('#back').onclick = () => goBack();
  PTR.init();
  // typing in a guarded form marks it as changed
  const mark = ev => { if (Guard.armed && ev.target && ev.target.closest && ev.target.closest('#app')) Guard.dirty = true; };
  document.addEventListener('input', mark, true);
  document.addEventListener('change', mark, true);
  fill($('#brandline'), wordmark());
  Prefs.apply();
  updateOnline();
  if (!Native && 'serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(() => { /* optional */ });
  }
  if (Session.load()) {
    try {
      const r = await Auth.restore();
      if (r === 'FIRST_ADMIN') { hideBoot(); history.replaceState(null, '', '#/login'); LoginPage(); firstAdmin(); return; }
      buildNav(); Chat.load();
      const seen = Local.get('tokpra.seenVersion', '');
      if (seen !== APP.version) { Local.set('tokpra.seenVersion', APP.version); if (r !== 'OFFLINE') setTimeout(() => { if (!Lock.shown) whatsNew(); }, 900); }
      Lock.lockNow();
      if (r === 'OFFLINE') setTimeout(() => toast('ไม่มีสัญญาณ บันทึกรายการใหม่ได้ ระบบจะส่งให้เมื่อกลับมาออนไลน์'), 600);
    } catch (e) {
      if (e.code === E.NETWORK || e.code === E.TIMEOUT) {
        hideBoot();
        setPage({ auth: true });
        fill(app(), art(ART.logo, 'auth-mark'), emptyState('เชื่อมต่อไม่ได้', 'ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่',
          h('button', { class: 'btn soft inline', type: 'button', onclick: () => location.reload() }, ic('refresh', 'sm'), 'ลองใหม่'), 'wifioff'));
        return;
      }
      Session.clear();
    }
  }
  await route();
  hideBoot();
})();
